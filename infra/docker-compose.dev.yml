# Développement : seulement les dépendances ; web/worker tournent en local (pnpm dev).
#   docker compose -f infra/docker-compose.dev.yml up -d
name: mise-dev
services:
  postgres:
    image: postgres:16.6-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: mise }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdev:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test.sql:ro]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
  planner:
    build: { context: ../services/planner }
    ports: ["127.0.0.1:8000:8000"]
volumes:
  pgdev:
