[project]
name = "mise-planner"
version = "1.0.0"
description = "Moteur de planification de repas (OR-Tools CP-SAT)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "ortools==9.15.6755",
  "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "ruff==0.17.5",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
