name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: mise_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mise_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mise/domain build && pnpm --filter @mise/db build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (domaine ≥ 90 % de couverture, intégration PostgreSQL)
        run: pnpm --filter @mise/domain test:coverage && pnpm --filter @mise/db test && pnpm --filter @mise/web test
      - name: Audit des dépendances
        run: pnpm audit --prod --audit-level high

  planner:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/planner } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy
      - name: Tests (dont propriété allergènes sur 10 000 cas)
        run: uv run pytest --cov=planner --cov-fail-under=90 -p no:warnings
      - name: Benchmark (500 recettes, 7 j × 3 repas, 6 membres)
        run: uv run python ../../bench/run.py --runs 3
      - name: Audit des dépendances Python
        run: uvx pip-audit==2.9.0 -r <(uv export --frozen --no-dev --no-hashes)

  e2e:
    runs-on: ubuntu-24.04
    needs: [node, planner]
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: mise }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mise
      PLANNER_URL: http://localhost:8000
      APP_URL: http://localhost:3000
      DATA_ENCRYPTION_KEYS: k1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mise/domain build && pnpm --filter @mise/db build
      - run: pnpm --filter @mise/db seed
      - name: Solveur
        working-directory: services/planner
        run: uv sync --frozen --no-dev && (uv run uvicorn planner.app:app --port 8000 &) && sleep 5
      - run: pnpm --filter @mise/web build
      - run: pnpm --filter @mise/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mise/web e2e
      - name: Lighthouse CI (budget de performance et accessibilité)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=apps/web/lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  docker:
    runs-on: ubuntu-24.04
    needs: [node, planner]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
